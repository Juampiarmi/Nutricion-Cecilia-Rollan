<style>
:root{--bg:#0B0F17;--bg2:#0E1420;--panel:#131B2A;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.12);--cyan:#38BDF8;--cyan-soft:rgba(56,189,248,.1);--cyan-edge:rgba(56,189,248,.2);--fire:#F97316;--fire-hot:#FF5E1E;--fire-soft:rgba(249,115,22,.1);--danger:#EF4444;--title:#FFFFFF;--text:#94A3B8;--micro:#64748B;--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:Inter,"Geist Sans",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding:max(1.25rem,calc(env(safe-area-inset-top) + 10px)) 16px calc(var(--safe-bot) + 112px);background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(180deg,var(--bg),var(--bg2));background-size:28px 28px,28px 28px,auto;background-attachment:fixed}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.mono,.kcal,.prog,.bar .l span,.meal .time,.item .g,.opt .g,.ring .v b{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.tag{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan)}
.muted{color:var(--micro)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.top svg{flex:none}
.brand{font-weight:700;letter-spacing:.04em;font-size:15px;color:var(--title)}
.brand b{color:var(--fire);font-weight:700}
.handle{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--micro)}
.phase{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--fire);background:var(--fire-soft);border:1px solid rgba(249,115,22,.35);padding:5px 8px;border-radius:6px;font-weight:700;text-align:center;line-height:1.25}
h1{font-weight:700;font-size:27px;line-height:1.08;letter-spacing:-.02em;margin:6px 0 6px;color:var(--title)}
.note{font-size:13.5px;color:var(--text);margin-bottom:16px}
.switch{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px;margin:14px 0 16px;position:relative}
.switch button{position:relative;z-index:1;padding:12px 6px;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.12em;font-weight:700;color:var(--micro);transition:color .25s}
.switch button.on{color:var(--title)}
.switch .knob{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:9px;background:rgba(56,189,248,.08);border:1px solid var(--cyan);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.switch.off .knob{transform:translateX(100%)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.card:before{content:"";position:absolute;inset:0;border-radius:14px;pointer-events:none;background:linear-gradient(90deg,var(--cyan) 0 12px,transparent 12px) top left/100% 1px no-repeat,linear-gradient(var(--cyan) 0 12px,transparent 12px) top left/1px 100% no-repeat;opacity:.55}
.hero{display:flex;align-items:center;gap:14px}
.hero>div:last-child{min-width:0}
.ring{width:92px;height:92px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg);width:92px;height:92px}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .v b{font-size:19px;line-height:1;color:var(--title)}
.ring .v span{font-family:"JetBrains Mono",monospace;font-size:8.5px;letter-spacing:.14em;color:var(--micro);margin-top:3px}
.kcal{font-weight:700;font-size:clamp(32px,10.5vw,44px);line-height:.95;letter-spacing:-.03em;white-space:nowrap;color:var(--title)}
.kcal small{font-size:11px;letter-spacing:.18em;color:var(--micro);font-weight:500;margin-left:4px}
.prog{font-size:10.5px;color:var(--text);letter-spacing:.04em}
.bars{display:grid;gap:11px;margin-top:16px}
.bar .l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;color:var(--text)}
.bar .l b{color:var(--title)}
.bar .t{height:4px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:3px;background:var(--cyan);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar.f .t i{background:var(--fire)}
.sec{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:22px 2px 10px}
.meal{padding:0}
.meal .hd{display:flex;align-items:center;gap:12px;padding:14px 14px 10px}
.meal .time{font-size:12px;color:var(--cyan);background:var(--cyan-soft);border:1px solid var(--cyan-edge);padding:4px 7px;border-radius:6px}
.meal .nm{font-weight:700;font-size:16px;letter-spacing:-.01em;line-height:1.15;color:var(--title)}
.meal .mm{font-size:12px;color:var(--text);margin-top:3px}
.chk{margin-left:auto;width:34px;height:34px;flex:none;border-radius:9px;border:1px solid var(--line2);display:grid;place-items:center;transition:all .2s}
.chk svg{opacity:0;transform:scale(.6);transition:all .2s}
.chk svg path{stroke:var(--cyan)}
.done .chk{background:rgba(56,189,248,.08);border-color:var(--cyan)}
.done .chk svg{opacity:1;transform:none}
.done .items{opacity:.5}
.items{border-top:1px solid var(--line);transition:opacity .2s}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .g{font-weight:700;font-size:13px;min-width:64px;color:var(--title)}
.item .g em{display:block;font-style:normal;font-weight:400;font-size:10px;color:var(--micro);margin-top:1px}
.item .fd{flex:1;font-size:14.5px;line-height:1.25;color:var(--title)}
.item .fd s{text-decoration:none;display:block;font-size:11px;color:var(--fire);margin-top:2px}
.item .sw{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.1em;color:var(--cyan);border:1px solid var(--cyan-edge);background:var(--cyan-soft);padding:4px 7px;border-radius:6px}
.leu{display:flex;align-items:center;gap:8px;padding:9px 14px;font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.04em;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.leu .dot{width:6px;height:6px;border-radius:50%;flex:none}
.leu.ok{color:var(--cyan);background:rgba(56,189,248,.05)}.leu.ok .dot{background:var(--cyan)}
.leu.low{color:var(--fire);background:var(--fire-soft)}.leu.low .dot{background:var(--fire);animation:pulse 1.4s infinite}
.leu.na{color:var(--micro)}.leu.na .dot{background:var(--micro)}
@keyframes pulse{50%{opacity:.3}}
.sup{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--line)}
.sup:last-child{border-bottom:0}
.sup .chk{margin-left:0;width:28px;height:28px;margin-top:2px}
.sup.done .chk{background:rgba(56,189,248,.08);border-color:var(--cyan)}
.sup b{display:block;font-size:14.5px;color:var(--title)}
.sup .ds,.sup .tm{font-size:13px;color:var(--text)}
.sup .ds em,.sup .tm em{font-style:normal;font-family:"JetBrains Mono",monospace;color:var(--micro);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;margin-right:6px}
.sup a{font-family:"JetBrains Mono",monospace;font-size:9.5px;color:var(--micro);letter-spacing:.04em;text-decoration:none;display:block;margin-top:4px}
.alert{border-color:rgba(249,115,22,.35)}
.alert:before{background:linear-gradient(90deg,var(--fire) 0 12px,transparent 12px) top left/100% 1px no-repeat,linear-gradient(var(--fire) 0 12px,transparent 12px) top left/1px 100% no-repeat}
.alert .tag{color:var(--fire)}
.cites{margin-top:26px;font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.06em;color:var(--micro);line-height:1.9}
.cites a{color:var(--micro);text-decoration:none}
.foot{display:flex;align-items:center;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.dock{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(var(--safe-bot) + 10px);background:linear-gradient(0deg,rgba(11,15,23,.98) 60%,rgba(11,15,23,0));display:flex;gap:8px;z-index:5}
.btn{flex:1;padding:14px;border-radius:12px;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;transition:background .2s,box-shadow .2s,border-color .2s}
.btn.fire{background:var(--fire);border:1px solid var(--fire);color:#fff}
.btn.fire:active,.btn.fire:hover{background:var(--fire-hot);box-shadow:0 0 18px -6px rgba(255,94,30,.8)}
.btn.ghost{border:1px solid var(--line2);color:var(--text);background:var(--panel)}
.sheet-bg{position:fixed;inset:0;background:rgba(11,15,23,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:10;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--panel);border-top:1px solid var(--line2);border-radius:18px 18px 0 0;padding:18px 16px calc(var(--safe-bot) + 18px);max-height:78vh;overflow:auto;transform:translateY(105%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s linear .3s}
.sheet.open{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:42px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 14px}
.sheet h3{font-size:17px;font-weight:700;color:var(--title);margin:6px 0 4px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 12px;border:1px solid var(--line);border-radius:11px;margin-top:8px;background:var(--bg)}
.opt.cur{border-color:var(--cyan);background:rgba(56,189,248,.08)}
.opt .g{font-weight:700;min-width:64px;color:var(--title)}
.opt .fd{flex:1;color:var(--title)}
.opt .fd span{display:block;font-size:11.5px;color:var(--text);margin-top:2px}
.steps{list-style:none;margin-top:12px;display:grid;gap:10px}
.steps li{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--text)}
.steps li b{color:var(--title);font-weight:600}
.steps .n{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:700;color:var(--cyan);background:var(--cyan-soft);border:1px solid var(--cyan-edge)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:12px;padding:4px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.tabs button{padding:8px;border-radius:7px;font-family:"JetBrains Mono",monospace;font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--micro)}
.tabs button.on{color:var(--title);background:rgba(56,189,248,.08);box-shadow:inset 0 0 0 1px var(--cyan)}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-bot) + 84px);transform:translate(-50%,20px);background:var(--panel);border:1px solid var(--line2);color:var(--title);padding:10px 14px;border-radius:10px;font-size:12px;opacity:0;transition:all .25s;z-index:20;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.badge{display:inline-block;margin-top:3px;font-family:"JetBrains Mono",monospace;font-size:8.5px;font-weight:700;letter-spacing:.14em;color:var(--cyan);background:var(--cyan-soft);border:1px solid var(--cyan-edge);border-radius:4px;padding:2px 5px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hv{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;font-size:11px;color:var(--title);white-space:nowrap}
.gauge{position:relative;margin:10px auto 0;max-width:320px}
.gauge svg{display:block;width:100%;height:auto}
.gv{position:absolute;left:0;right:0;bottom:2px;text-align:center}
.glabel{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.2em;color:var(--micro)}
.gnum{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;font-weight:700;font-size:clamp(38px,12vw,52px);line-height:1;letter-spacing:-.03em;color:var(--title)}
.gnum.over{color:var(--fire)}
.gsub{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;font-size:11px;color:var(--text);margin-top:2px}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.mini{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 6px 7px;text-align:center}
.mini svg{display:block;width:100%;max-width:84px;height:auto;margin:0 auto}
.mini b{display:block;font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;font-size:14px;color:var(--title);margin-top:-6px}
.mini b i{font-style:normal;font-size:10px;color:var(--micro);font-weight:500}
.mini span{display:block;font-family:"JetBrains Mono",monospace;font-size:8.5px;letter-spacing:.16em;color:var(--micro);margin-top:2px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 12px}
.actions button{padding:10px 4px;border:1px solid var(--cyan-edge);background:var(--cyan-soft);color:var(--cyan);border-radius:10px;font-family:"JetBrains Mono",monospace;font-size:9px;font-weight:700;letter-spacing:.06em}
.actions button:active{border-color:var(--cyan)}
.cups{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:12px}
.cup{height:34px;border:1px solid var(--line2);border-radius:4px 4px 8px 8px;position:relative;overflow:hidden;background:var(--bg)}
.cup i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,#7DD3FC,#38BDF8);transition:height .3s}
.cup.on{border-color:rgba(56,189,248,.6)}
.cup.on i{height:82%}
.wbtns{display:flex;gap:6px;margin-top:10px}
.wbtns button{flex:1;padding:9px 6px;border-radius:9px;border:1px solid var(--cyan-edge);background:var(--cyan-soft);color:var(--cyan);font-family:"JetBrains Mono",monospace;font-size:10.5px;font-weight:700;letter-spacing:.06em}
.wbtns button.ghost{border-color:var(--line2);background:transparent;color:var(--text)}
.wbtns button.cta{border-color:var(--fire);background:var(--fire);color:#fff}
.ok-line{margin-top:8px;font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.1em;color:var(--cyan)}
.dial{display:flex;align-items:center;gap:12px;margin-top:8px}
.dial svg{flex:none;width:52%;max-width:200px;height:auto}
.dial .dl{font-family:"JetBrains Mono",monospace;font-size:9px;fill:#64748B}
.dinfo{min-width:0;display:flex;flex-direction:column;gap:3px}
.dinfo small{font-family:"JetBrains Mono",monospace;font-size:8.5px;letter-spacing:.18em;color:var(--micro)}
.dinfo b{font-size:15px;color:var(--title);line-height:1.2}
.dinfo span{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;font-size:11px;color:var(--text)}
.dinfo em{font-style:normal;margin-top:6px;font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.06em;color:var(--micro)}
.dinfo em.hot{color:var(--fire)}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.06em;color:var(--micro)}
.legend i{display:inline-block;width:10px;height:6px;border-radius:3px;margin-right:5px;vertical-align:middle}
.lg-s{background:var(--fire)}.lg-w{background:rgba(56,189,248,.3)}.lg-m{border:1.5px solid var(--cyan);border-radius:50%!important;width:7px!important;height:7px!important}.lg-p{border:1.5px solid var(--fire);border-radius:50%!important;width:7px!important;height:7px!important}
.shop-cat{margin:14px 0 4px;font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan)}
.shop-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 0;border-bottom:1px solid var(--line)}
.shop-item .chk{margin-left:0;width:24px;height:24px}
.shop-item.done .chk{background:rgba(56,189,248,.08);border-color:var(--cyan)}
.shop-item.done .chk svg{opacity:1;transform:none}
.shop-item.done .sn{color:var(--micro);text-decoration:line-through}
.shop-item .sn{flex:1;font-size:14px;color:var(--title)}
.shop-item .sq{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;font-size:12px;color:var(--title);text-align:right}
.shop-item .sq em{display:block;font-style:normal;font-size:10px;color:var(--micro)}
.rule{border:1px solid var(--line);border-radius:10px;margin-top:8px;background:var(--bg)}
.rule summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:11px 12px;font-weight:600;font-size:14px;color:var(--title)}
.rule summary::-webkit-details-marker{display:none}
.rule .n{flex:none;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--fire);background:var(--fire-soft);border:1px solid rgba(249,115,22,.35)}
.rule p{padding:0 12px 12px 44px;font-size:13.5px;color:var(--text)}
.ph{display:block;width:100%;max-height:240px;object-fit:cover;border-radius:12px;border:1px solid var(--line);margin-top:10px}
.lbl{display:block;margin-top:12px;font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--micro)}
.inp{width:100%;margin-top:5px;padding:10px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--bg);color:var(--title);font:inherit;font-size:14px}
[hidden]{display:none!important}
body.standalone .dock{display:none}
.sheet{padding-top:22px}
.xclose{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:9px;border:1px solid var(--line2);color:var(--text);font-size:13px;display:grid;place-items:center;background:var(--bg)}
.opt .go{font-size:20px;color:var(--cyan);line-height:1}
.dialcard{padding:0}
.dialcard>.dial,.dialcard>.legend{padding:0 16px}
.dialcard>.legend{padding-bottom:14px}
.dial-hd{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:14px 16px}
.dial-peek{flex:1;min-width:0;text-align:right;font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{flex:none;width:9px;height:9px;border-right:2px solid var(--cyan);border-bottom:2px solid var(--cyan);transform:rotate(45deg) translate(-2px,-2px);transition:transform .25s}
.chev.up{transform:rotate(-135deg) translate(-2px,-2px)}
.dial .dnow{font-family:"JetBrains Mono",monospace;font-size:9.5px;font-weight:700;letter-spacing:.08em}
.lg-n{background:var(--cyan);border-radius:50%!important;width:7px!important;height:7px!important;box-shadow:0 0 0 3px rgba(56,189,248,.25)}
.item.extra{border-left:2px solid var(--cyan)}
.item .fd s.ia{color:var(--cyan)}
.item .rm{flex:none;width:28px;height:28px;border-radius:7px;border:1px solid var(--line2);color:var(--micro);font-size:11px}
.wbtns button[disabled]{opacity:.5}
.cfg-link{display:block;width:100%;margin-top:14px;padding:10px;border:1px dashed var(--cyan-edge);border-radius:10px;font-family:"JetBrains Mono",monospace;font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--cyan)}
.cfg{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.scan-busy{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border:1px solid var(--cyan-edge);border-radius:10px;background:var(--cyan-soft);font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--cyan)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--cyan-edge);border-top-color:var(--cyan);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.scan-err{margin-top:12px;padding:10px 12px;border:1px solid rgba(239,68,68,.45);border-radius:10px;background:rgba(239,68,68,.1);font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--danger)}
.scan{margin-top:12px;padding:12px;border:1px solid var(--cyan-edge);border-radius:12px;background:var(--bg)}
.scan-nm{display:block;margin-top:2px;font-size:15px;color:var(--title)}
.score{flex:none;width:64px;padding:6px 4px;border:1.5px solid;border-radius:10px;text-align:center}
.score b{display:block;font-family:"JetBrains Mono",monospace;font-size:22px;line-height:1}
.score span{display:block;margin-top:2px;font-family:"JetBrains Mono",monospace;font-size:6.5px;letter-spacing:.1em;color:var(--micro)}
.scan-items{margin-top:8px}
.scan-it{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.scan-it .g{min-width:52px;font-family:"JetBrains Mono",monospace;font-weight:700;color:var(--title)}
.scan-it .fd{flex:1;min-width:0;color:var(--title)}
.scan-it .mc{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--text);white-space:nowrap}
.scan-tot{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;font-size:11px;color:var(--text)}
.scan-tot b{color:var(--title)}
.scan-tot .ok{color:var(--cyan)}.scan-tot .lo{color:var(--fire)}
.tips{margin:8px 0 0 16px;font-size:12px;color:var(--text)}
.add-meal{display:block;width:100%;margin-top:10px;padding:11px;border-radius:10px;background:var(--fire);color:#fff;font-family:"JetBrains Mono",monospace;font-size:10.5px;font-weight:700;letter-spacing:.08em}
.gv.done .glabel{padding:0 16%;color:#38BDF8;font-weight:700;letter-spacing:.05em;font-size:9px;line-height:1.35;text-shadow:0 0 12px rgba(56,189,248,.55)}
.gv.done .gnum{color:#38BDF8;font-size:clamp(30px,10vw,42px);letter-spacing:.02em;text-shadow:0 0 22px rgba(56,189,248,.45)}
.gauge .glow{filter:drop-shadow(0 0 6px rgba(56,189,248,.65))}
.mini.done{border-color:rgba(56,189,248,.55);background:rgba(56,189,248,.07);box-shadow:0 0 14px -6px rgba(56,189,248,.7)}
.mini.done svg path:last-child{filter:drop-shadow(0 0 3px rgba(56,189,248,.8))}
.mini.done span{color:#38BDF8}
/* ---- Header HUD compacto ---- */
.top .tb{flex:none}
.top .phase{min-width:0;overflow:hidden}
.top .badge{font-size:7.5px;padding:1px 4px}
.top .brand{white-space:nowrap}
@media (max-width:370px){.top .badge{display:none}.top .phase{font-size:7.5px;letter-spacing:.03em;padding:4px 5px}.guide-btn{padding:6px;letter-spacing:0}.top{gap:7px}.top .brand{font-size:13.5px}}
.top .phase{font-size:8px;padding:4px 6px;max-width:34%}
.guide-btn{flex:none;padding:6px 8px;border-radius:8px;border:1px solid var(--cyan-edge);background:var(--cyan-soft);color:var(--cyan);font-family:"JetBrains Mono",monospace;font-size:9.5px;font-weight:700;letter-spacing:.06em;white-space:nowrap}
.idrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.who{min-width:0;display:flex;flex-direction:column}
.who b{font-size:15px;font-weight:700;letter-spacing:.01em;color:var(--title);text-transform:uppercase;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.who span{font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.14em;color:var(--fire);text-transform:uppercase;margin-top:2px}
.datesel{flex:none;display:flex;align-items:center;border:1px solid var(--line2);border-radius:10px;background:var(--bg);overflow:hidden}
.datesel button{width:30px;height:34px;color:var(--cyan);font-size:11px}
.datesel button:active{background:var(--cyan-soft)}
.dlab{min-width:104px;text-align:center;font-family:"JetBrains Mono",monospace;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--text);border-left:1px solid var(--line);border-right:1px solid var(--line);padding:0 6px;line-height:34px}
.dlab.now{color:var(--title)}
.back-today{display:block;width:100%;margin:0 0 8px;padding:8px;border-radius:9px;border:1px dashed rgba(249,115,22,.5);background:var(--fire-soft);color:var(--fire);font-family:"JetBrains Mono",monospace;font-size:10px;font-weight:700;letter-spacing:.08em}
.directive{border:1px solid var(--line);border-radius:10px;background:rgba(19,27,42,.7);margin-bottom:4px}
.directive button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:9px 11px}
.directive .dh{flex:1;min-width:0;font-size:12.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.directive .dh b{color:var(--title);font-weight:600}
.directive .dv{flex:none;font-family:"JetBrains Mono",monospace;font-size:9.5px;color:var(--cyan);letter-spacing:.04em}
.directive p{padding:0 11px 11px;font-size:13px;color:var(--text);line-height:1.5}
.switch{margin:10px 0 12px}
/* ---- Victoria táctica + racha ---- */
.gauge.won .gv.done .glabel{animation:cyanpulse 1.8s ease-in-out infinite}
.gauge.won svg{animation:glowpulse 1.8s ease-in-out infinite}
@keyframes cyanpulse{50%{text-shadow:0 0 20px rgba(56,189,248,.95);opacity:.85}}
@keyframes glowpulse{50%{filter:drop-shadow(0 0 10px rgba(56,189,248,.55))}}
.streak{margin-top:12px;text-align:center;font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--fire);padding:7px;border:1px solid rgba(249,115,22,.35);border-radius:9px;background:var(--fire-soft)}
.streak.hot{color:#FDBA74;box-shadow:0 0 18px -8px rgba(249,115,22,.9)}
/* ---- Timeline horizontal peri-entreno ---- */
.tlcard{padding:0}
.tl-hd{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:14px 16px}
.tl-peek{flex:1;min-width:0;text-align:right;font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl{position:relative;margin:0 16px;padding:18px 0 4px}
.tl-labels,.tl-axis{position:relative;height:14px}
.tl-labels span,.tl-axis span{position:absolute;transform:translateX(-50%);font-family:"JetBrains Mono",monospace;font-size:8.5px;color:var(--micro);white-space:nowrap}
.tl-labels span.up{top:-12px;color:var(--cyan)}
.tl-labels span.dn{top:0;color:var(--cyan)}
.tl-axis{margin-top:6px}
.tl-axis span:first-child{transform:none}.tl-axis span:last-child{transform:translateX(-100%)}
.tl-track{position:relative;height:22px;border-radius:6px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.tl-win{position:absolute;top:0;bottom:0;background:rgba(56,189,248,.14)}
.tl-train{position:absolute;top:3px;bottom:3px;border-radius:4px;background:linear-gradient(90deg,#F97316,#FF5E1E);box-shadow:0 0 12px -2px rgba(249,115,22,.7)}
.tl-dot{position:absolute;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:#131B2A;border:2px solid var(--cyan);z-index:2}
.tl-dot.done{background:var(--cyan)}
.tl-dot.next{box-shadow:0 0 0 4px rgba(56,189,248,.25)}
.tl-now{position:absolute;top:-8px;bottom:-8px;width:2px;margin-left:-1px;background:#FFFFFF;box-shadow:0 0 8px rgba(255,255,255,.8);z-index:3}
.tl-now span{position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);font-family:"JetBrains Mono",monospace;font-size:8.5px;font-weight:700;color:#0B0F17;background:#FFFFFF;border-radius:3px;padding:0 3px}
.tl-info{display:flex;flex-direction:column;gap:2px;padding:12px 16px 0;font-size:13px;color:var(--text)}
.tl-info b{color:var(--title)}

.tl-info em{font-style:normal;color:var(--fire)}
.tlcard .legend{padding:0 16px 14px}

.scantabs{margin-top:10px}
.lt{margin-top:8px;border:1px solid var(--line);border-radius:10px;overflow:hidden}

.lt-hd{grid-template-columns:1fr auto;background:rgba(255,255,255,.04);font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.1em;color:var(--micro);text-transform:uppercase}
.lt-row{border-top:1px solid var(--line);color:var(--text)}
.lt-row i{font-style:normal;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--micro)}
.lt-row b{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--title);min-width:64px;text-align:right}
.portions{display:flex;align-items:center;gap:10px;margin-top:6px}
.portions button{width:34px;height:34px;border-radius:9px;border:1px solid var(--cyan-edge);background:var(--cyan-soft);color:var(--cyan);font-size:16px;font-weight:700}
.portions b{font-family:"JetBrains Mono",monospace;font-size:16px;color:var(--title);min-width:28px;text-align:center}
.portions span{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--micro)}

.rule p+p{padding-top:0}

.reset-row{margin-top:18px;text-align:center}

.scan-info{margin-top:12px;padding:10px 12px;border:1px solid var(--cyan-edge);border-radius:10px;background:var(--cyan-soft);font-size:12.5px;color:var(--title);line-height:1.45}

  var CHECK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#38BDF8" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  // ---------- Datos del día ----------
  var MACRO_GROUPS = { p: ['lean-protein', 'dairy-protein', 'eggs', 'protein-snack'], c: ['cereal', 'starch', 'fruit', 'sport-carb'], f: ['fat'] };
  var ANCHOR_LABEL = { p: 'proteína', c: 'carbohidratos', f: 'grasas' };
  function kcal100(f) { return f.p * 4 + f.c * 4 + f.f * 9; }

  // Origen de un swap (valores por 100 g): alimento de la base o alimento libre (IA) por macro principal.
  function srcOf(it) {
    if (it.foodId && D.foods[it.foodId]) {
      var f = D.foods[it.foodId], an = D.anchors[f.group];
      return { name: f.name, group: f.group, anchor: an, p: f.p, c: f.c, f: f.f, groups: [f.group] };
    }
    if (!(it.grams > 0)) return null;
    var k = 100 / it.grams, p = it.p * k, c = it.c * k, fa = it.f * k;
    if (p + c + fa <= 0) return null;
    var mp = it.macroPrincipal;
    var a = mp === 'protein' ? 'p' : mp === 'carbs' ? 'c' : mp === 'fat' ? 'f' : (p * 4 >= c * 4 && p * 4 >= fa * 9 ? 'p' : c * 4 >= fa * 9 ? 'c' : 'f');
    return { name: it.food, group: null, anchor: a, p: p, c: c, f: fa, groups: MACRO_GROUPS[a] };
  }

  function eqGrams(src, grams, to) {
    var a = src.anchor;
    return to[a] > 0 ? Math.max(5, Math.round((src[a] * grams) / to[a] / 5) * 5) : grams;
  }

  // Equivalencias calculadas: mismo aporte del macro ancla, ordenadas por densidad calórica más parecida.
  function swapOptions(orig) {
    var src = orig && srcOf(orig);
    if (!src) return [];
    var dens = kcal100(src);
    return Object.keys(D.foods)
      .filter(function (id) { var f = D.foods[id]; return id !== orig.foodId && src.groups.indexOf(f.group) >= 0 && f[src.anchor] > 0; })
      .map(function (id) { var f = D.foods[id]; return { id: id, f: f, g: eqGrams(src, orig.grams, f), d: Math.abs(kcal100(f) - dens) }; })
      .sort(function (a, b) { return a.d - b.d; })
      .slice(0, 6);
  }

  function resolveItem(it) {
    var sw = S.swaps[it.id];
    if (!sw || !D.foods[sw]) return it;
    var src = srcOf(it);
    if (!src) return it;
    var to = D.foods[sw];
    var grams = eqGrams(src, it.grams, to);
    var k = grams / 100;
    return { id: it.id, foodId: sw, food: to.name, grams: grams, p: to.p * k, c: to.c * k, f: to.f * k, leucine: to.leucine * k, swappedFrom: src.name };
  }

  // Día OFF: no hay sesión → los bloques pre / peri-entreno se muestran como merienda de saciedad.
  var PERI_RE = /pre.?entreno|pre.?wod|peri.?wod|peri.?entreno|intra|glucol[ií]tico|para entrenar/i;
  function isOffPeri(m, mode) { return mode === 'off' && (m.role === 'peri' || PERI_RE.test(m.name)); }
  function mealName(m, mode) { return isOffPeri(m, mode) ? 'Merienda Táctica OFF' : m.name; }

  // Comida libre controlada (Comer fuera): bloque promedio balanceado que reemplaza la comida en la telemetría.
  var FREE_MEAL = { p: 45, c: 70, f: 32 };
  function freeItem(m, sc) {
    var lbl = (OUT_SCENES.filter(function (o) { return o.id === sc; })[0] || {}).label || 'Salida';
    return { id: 'free-' + m.id, food: 'Comida libre controlada · ' + lbl, grams: 0, p: FREE_MEAL.p, c: FREE_MEAL.c, f: FREE_MEAL.f, leucine: FREE_MEAL.p * 0.08, free: true };
  }

  function mealsFor(mode, extras, free) {
    extras = extras || S.extras;
    free = free || S.free;
    var base = D.meals.filter(function (m) { return m.day === 'both' || m.day === mode; });
    var out = extras.__out;
    if (out && out.length) base = base.concat([{ id: '__out', name: 'Fuera del plan · análisis IA', time: out[0].at || '12:00', day: mode, role: 'snack', mps: false, items: [] }]);
    return base
      // Orden cronológico inquebrantable: 00:00-03:59 cuenta como final del día (nunca antes del desayuno).
      .sort(function (a, b) { return timeToMinutes(a.time) - timeToMinutes(b.time); })
      .map(function (m) {
        var items = free[m.id] ? [freeItem(m, free[m.id])] : m.items.map(resolveItem).concat(extras[m.id] || []);
        var t = items.reduce(function (a, i) { return { p: a.p + i.p, c: a.c + i.c, f: a.f + i.f, l: a.l + i.leucine }; }, { p: 0, c: 0, f: 0, l: 0 });
        return { m: m, items: items, t: t, kcal: t.p * 4 + t.c * 4 + t.f * 9 };
      });
  }

  // Cumplimiento: todas las comidas tildadas y kcal dentro de ±5 % del plan.
  var ADHERENCE_TOL = 0.05;

  function daySummary(iso) {
    var cur = iso === S.date;
    var checks = cur ? S.checks : store.get('checks:' + iso, {});
    var mode = cur ? S.mode : modeFor(iso);
    var list = mealsFor(mode, cur ? S.extras : store.get('extras:' + iso, {}), cur ? S.free : store.get('free:' + iso, {}));
    var tgt = D.targets[mode];
    var done = 0, k = 0;
    list.forEach(function (x) { if (checks[x.m.id]) { done++; k += x.kcal; } });
    var pct = tgt.kcal ? k / tgt.kcal : 0;
    return { date: iso, mode: mode, done: done, total: list.length, kcal: Math.round(k), target: tgt.kcal, pct: Math.round(pct * 100), adherent: list.length > 0 && done === list.length && Math.abs(pct - 1) <= ADHERENCE_TOL };
  }

  var H = store.get('history', {});
  function archive(iso) {
    if (D.preview || iso > today) return;
    var sum = daySummary(iso);
    // Sin registros locales para esa fecha: se conserva lo ya archivado (nunca se pisa con un día vacío).
    if (!sum.done && (iso === S.date ? !Object.keys(S.checks).length : store.get('checks:' + iso, null) === null)) return;
    H[iso] = sum;
    store.set('history', H);
  }

  // Racha: días consecutivos en adherencia total hasta hoy (hoy cuenta sólo si ya está cumplido).
  function streak() {
    var n = daySummary(today).adherent ? 1 : 0;
    var d = addDays(today, -1);
    for (var i = 0; i < 400; i++) {
      var h = H[d];
      if (!h || !h.adherent) break;
      n++;
      d = addDays(d, -1);
    }
    return n;
  }

  // Cambia el día consultado (historial hacia atrás, vista previa del plan hacia adelante).
  function loadDay(iso) {
    if (S.date !== iso) archive(S.date);
    S.date = iso;
    S.checks = store.get('checks:' + iso, {});
    S.water = store.get('water:' + iso, 0);
    S.extras = store.get('extras:' + iso, {});
    S.free = store.get('free:' + iso, {});
    if (!D.preview) S.mode = modeFor(iso);
  }

  function unitHintFor(foodId, grams) {
    var ref = foodId && D.foods[foodId];
    if (!ref || !ref.unit) return '';
    var q = grams / ref.unit.grams;
    if (q < 0.5) return '';
    var qq = Math.round(q * 2) / 2, lab = ref.unit.label;
    return '≈ ' + n1(qq) + ' ' + esc(qq > 1 && lab.length > 3 ? (/ón$/.test(lab) ? lab.slice(0, -2) + 'ones' : lab + 's') : lab);
  }

  function leuTip(need) {
    var egg = D.foods.huevo ? D.foods.huevo.leucine * 0.5 : 0.55;
    var whey = D.foods.whey ? D.foods.whey.leucine / 100 : 0.085;
    var eggs = Math.max(1, Math.ceil(need / egg));
    var g = Math.max(5, Math.ceil(need / whey / 5) * 5);
    return 'Sumá ' + eggs + ' huevo' + (eggs > 1 ? 's' : '') + ' o ' + g + ' g de whey';
  }

  function timeToMinutes(hhmm) {
    var p = /^(\d{1,2}):(\d{2})/.exec(hhmm || '');
    if (!p) return 720;
    var t = (+p[1] % 24) * 60 + +p[2];
    return t < 240 ? t + 1440 : t;
  }

  function toMin(hhmm) { var p = String(hhmm || '0:0').split(':'); return (+p[0] || 0) * 60 + (+p[1] || 0); }
  function fmtDur(min) { var h = Math.floor(min / 60), m = Math.round(min % 60); return h ? h + ' h ' + (m < 10 ? '0' : '') + m + ' min' : m + ' min'; }

  // ---------- 1 · Gauge semi-arco ----------
  function arcD(cx, cy, r) { return 'M' + (cx - r) + ' ' + cy + ' A' + r + ' ' + r + ' 0 0 1 ' + (cx + r) + ' ' + cy; }

  function gauge(tgt, eaten, complete, run) {
    var r = 118, len = Math.PI * r, pct = complete ? 1 : tgt.kcal ? Math.min(1, eaten.k / tgt.kcal) : 0;
    var left = tgt.kcal - eaten.k;
    var ticks = '';
    for (var i = 0; i <= 20; i++) {
      var a = Math.PI - (i / 20) * Math.PI, r1 = i % 5 ? 132 : 128, r2 = 138;
      ticks += '<line x1="' + (150 + r1 * Math.cos(a)).toFixed(1) + '" y1="' + (146 - r1 * Math.sin(a)).toFixed(1) + '" x2="' + (150 + r2 * Math.cos(a)).toFixed(1) + '" y2="' + (146 - r2 * Math.sin(a)).toFixed(1) + '" stroke="rgba(148,163,184,' + (i % 5 ? '.25' : '.55') + ')" stroke-width="1.2"/>';
    }
    var h = '<div class="gauge' + (complete ? ' won' : '') + '"><svg viewBox="0 0 300 156" aria-hidden="true">' + ticks;
    h += '<path d="' + arcD(150, 146, r) + '" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="12" stroke-linecap="round"/>';
    h += '<path d="' + arcD(150, 146, r) + '" fill="none" stroke="' + (!complete && left < 0 ? '#F97316' : '#38BDF8') + '" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + len.toFixed(1) + '" stroke-dashoffset="' + (len * (1 - pct)).toFixed(1) + '" style="transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)"' + (complete ? ' class="glow"' : '') + '/>';
    if (complete) {
      h += '</svg><div class="gv done"><div class="glabel">[ PROTOCOLO CUMPLIDO · ADHERENCIA TOTAL ]</div><div class="gnum">100%</div><div class="gsub">' + n0(eaten.k) + ' / ' + n0(tgt.kcal) + ' kcal · OBJETIVO</div></div></div>';
    } else {
      h += '</svg><div class="gv"><div class="glabel">' + (left >= 0 ? 'KCAL RESTANTES' : 'KCAL EXCEDIDAS') + '</div><div class="gnum' + (left < 0 ? ' over' : '') + '">' + n0(Math.abs(left)) + '</div><div class="gsub">' + n0(eaten.k) + ' / ' + n0(tgt.kcal) + ' kcal</div></div></div>';
    }
    h += '<div class="minis">' + mini('PROTEÍNA', eaten.p, tgt.p, '#38BDF8', complete) + mini('CARBOS', eaten.c, tgt.c, '#7DD3FC', complete) + mini('GRASAS', eaten.f, tgt.f, '#F97316', complete) + '</div>';
    if (run > 0) h += '<div class="streak' + (complete ? ' hot' : '') + '">🔥 ' + run + ' DÍA' + (run > 1 ? 'S' : '') + ' EN ADHERENCIA</div>';
    return h;
  }

  function mini(label, cur, tgt, color, complete) {
    var r = 34, len = Math.PI * r, pct = complete ? 1 : tgt ? Math.min(1, cur / tgt) : 0;
    if (complete) color = '#38BDF8';
    return '<div class="mini' + (complete ? ' done' : '') + '"><svg viewBox="0 0 84 46" aria-hidden="true"><path d="' + arcD(42, 42, r) + '" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="6" stroke-linecap="round"/><path d="' + arcD(42, 42, r) + '" fill="none" stroke="' + color + '" stroke-width="6" stroke-linecap="round" stroke-dasharray="' + len.toFixed(1) + '" stroke-dashoffset="' + (len * (1 - pct)).toFixed(1) + '" style="transition:stroke-dashoffset .6s"/></svg><b>' + n0(cur) + '<i>/' + n0(tgt) + ' g</i></b><span>' + label + '</span></div>';
  }

  // ---------- 2 · Hidratación ----------
  function hydration(mode) {
    var goal = mode === 'on' ? D.hydration.onMl : D.hydration.offMl;
    var cups = Math.ceil(goal / 250), full = Math.floor(S.water / 250);
    var h = '<section class="card"><div class="row"><span class="tag">[ HIDRATACIÓN · META ' + L(goal) + ' L · DÍA ' + mode.toUpperCase() + ' ]</span><span class="hv">' + L(S.water) + ' / ' + L(goal) + ' L</span></div><div class="cups">';
    for (var i = 0; i < cups; i++) h += '<button class="cup' + (i < full ? ' on' : '') + '" data-cup="' + i + '" aria-label="Vaso ' + (i + 1) + '"><i></i></button>';
    h += '</div><div class="wbtns"><button data-water="250">+250 ml</button><button data-water="500">+500 ml</button><button data-water="0" class="ghost">Reiniciar</button></div>';
    if (S.water >= goal) h += '<div class="ok-line">✓ META DE HIDRATACIÓN CUMPLIDA</div>';
    return h + '</section>';
  }

  // ---------- 3 · Timeline peri-entreno 06:00 → 23:00 ----------
  var T0 = 6 * 60, T1 = 23 * 60;
  function tx(min) { return Math.max(0, Math.min(100, ((min - T0) / (T1 - T0)) * 100)); }
  function hhmm(min) { min = ((min % 1440) + 1440) % 1440; return pad2(Math.floor(min / 60)) + ':' + pad2(min % 60); }

  function timeline(mode, list) {
    var start = toMin(D.training.time), end = start + Math.max(15, Number(D.training.minutes) || 60), nowMin = now.getHours() * 60 + now.getMinutes();
    var live = S.date === today;
    var next = null;
    if (live) list.forEach(function (x) { var t = toMin(x.m.time); if (!S.checks[x.m.id] && t >= nowMin && (!next || t < toMin(next.m.time))) next = x; });
    var peek = !live
      ? list.length + ' comidas · ' + (mode === 'on' ? 'entreno ' + hhmm(start) + '–' + hhmm(end) : 'día OFF')
      : next ? 'Próxima: ' + esc(mealName(next.m, mode)) + ' · ' + esc(next.m.time) : 'Sin ingestas pendientes';

    var h = '<section class="card tlcard"><button class="tl-hd" data-tl="1" aria-expanded="' + (S.tlOpen ? 'true' : 'false') + '" aria-label="' + esc(peek.replace(/<[^>]+>/g, '')) + '"><span class="tag">[ TIMELINE PERI-ENTRENO · 24H ]</span><span class="chev' + (S.tlOpen ? ' up' : '') + '"></span></button>';
    if (!S.tlOpen) return h + '</section>';

    var track = '';
    if (mode === 'on') {
      track += '<div class="tl-win" style="left:' + tx(start - 90).toFixed(2) + '%;width:' + (tx(end + 60) - tx(start - 90)).toFixed(2) + '%"></div>';
      track += '<div class="tl-train" style="left:' + tx(start).toFixed(2) + '%;width:' + Math.max(1.5, tx(end) - tx(start)).toFixed(2) + '%"></div>';
    }
    list.forEach(function (x) {
      var t = toMin(x.m.time), done = !!S.checks[x.m.id];
      track += '<span class="tl-dot' + (done ? ' done' : '') + (next && next.m.id === x.m.id ? ' next' : '') + '" style="left:' + tx(t).toFixed(2) + '%" title="' + esc(x.m.time + ' · ' + mealName(x.m, mode)) + '"></span>';
    });
    if (live && nowMin >= T0 && nowMin <= T1) track += '<div class="tl-now" style="left:' + tx(nowMin).toFixed(2) + '%"><span>' + hhmm(nowMin) + '</span></div>';

    var axis = '';
    var showNow = live && nowMin >= T0 && nowMin <= T1;
    [6, 9, 12, 15, 18, 23].forEach(function (hr) {
      // La etiqueta de la hora actual reemplaza a la marca del eje que tendría encima.
      if (showNow && Math.abs(tx(hr * 60) - tx(nowMin)) < 7) return;
      axis += '<span style="left:' + tx(hr * 60).toFixed(2) + '%">' + pad2(hr) + ':00</span>';
    });
    var labels = '';
    list.forEach(function (x, i) { labels += '<span class="' + (i % 2 ? 'dn' : 'up') + '" style="left:' + tx(toMin(x.m.time)).toFixed(2) + '%">' + esc(x.m.time) + '</span>'; });

    var info;
    if (!live) info = '<b>' + (S.date < today ? 'Registro del ' : 'Plan del ') + dateLabel(S.date) + '</b>';
    else if (next) info = 'Próxima ingesta: <b>' + esc(mealName(next.m, mode)) + '</b> en ' + fmtDur(toMin(next.m.time) - nowMin);
    else info = '<b>Sin ingestas pendientes</b> · plan del día al día';
    var rel = '';
    if (mode === 'on' && live) {
      if (nowMin < start) rel = 'Entreno ' + hhmm(start) + '–' + hhmm(end) + ' · en ' + fmtDur(start - nowMin);
      else if (nowMin <= end) rel = '<em class="hot">SESIÓN EN CURSO · quedan ' + fmtDur(end - nowMin) + '</em>';
      else rel = 'Entreno terminado hace ' + fmtDur(nowMin - end) + ' · ventana de recuperación';
    } else if (mode === 'on') rel = 'Entreno ' + hhmm(start) + '–' + hhmm(end);
    else rel = 'DÍA OFF · sin sesión';

    h += '<div class="tl"><div class="tl-labels">' + labels + '</div><div class="tl-track">' + track + '</div><div class="tl-axis">' + axis + '</div></div>';
    h += '<div class="tl-info"><div>' + info + '</div><span>' + rel + '</span></div>';
    h += '<div class="legend"><span><i class="lg-s"></i>Entreno</span><span><i class="lg-w"></i>Ventana peri</span><span><i class="lg-m"></i>Comida</span><span><i class="lg-n"></i>Ahora</span></div></section>';
    return h;
  }

  // ---------- 4 · Lista de compras semanal ----------
  function shoppingList() {
    var onDays = Math.max(0, Math.min(7, D.trainingDays)), mult = { on: onDays, off: 7 - onDays, both: 7 };
    var rules = D.shopRules || {};
    var acc = {};
    D.meals.forEach(function (m) {
      m.items.map(resolveItem).forEach(function (it) {
        var rule = (it.foodId && rules[it.foodId]) || {};
        var key = rule.key || it.foodId || 'x:' + it.food;
        if (!acc[key]) acc[key] = { foodId: it.foodId, name: rule.name || it.food, rule: rule, grams: 0 };
        acc[key].grams += it.grams * mult[m.day];
      });
    });
    var groups = {};
    Object.keys(acc).forEach(function (k) {
      var it = acc[k], ref = it.foodId && D.foods[it.foodId], r = it.rule;
      var cat = r.section || (ref ? D.categories[ref.group] : '') || D.shopFallback || 'Otros';
      var row = { key: k, name: it.name, grams: it.grams, cooked: it.grams, hint: '', note: '' };
      if (r.factor) {
        row.grams = it.grams * r.factor;
        if (r.pack) row.grams = Math.max(r.pack, Math.ceil(row.grams / r.pack) * r.pack);
        row.note = r.state === 'raw' ? 'equivale a ' + qty(it.grams) + ' cocido' : 'rinde ~' + qty(row.grams * 2.5) + ' cocido';
        row.raw = r.state === 'raw';
      } else {
        row.hint = unitHintFor(it.foodId, it.grams);
      }
      if (r.min && row.grams < r.min) { row.grams = r.min; row.label = r.minLabel; row.hint = ''; }
      if (r.byUnit) { var u = Math.ceil(it.grams / r.byUnit); row.label = u + ' ' + (u > 1 ? r.unitLabel : r.unitLabel.replace(/s$/, '')); row.hint = ''; }
      (groups[cat] = groups[cat] || []).push(row);
    });
    if (D.supplements.length) groups['Suplementos'] = (groups['Suplementos'] || []).concat(D.supplements.map(function (s) { return { key: 'sup:' + s.id, name: s.name, dose: s.dose }; }));
    return D.categoryOrder.filter(function (c) { return groups[c]; }).map(function (c) {
      return { cat: c, items: groups[c].sort(function (a, b) { return (b.grams || 0) - (a.grams || 0); }) };
    });
  }

  function qty(g) { return g >= 1000 ? n1(Math.round(g / 100) / 10) + ' kg' : n0(Math.round(g / 10) * 10) + ' g'; }
  function shopQty(i) {
    if (i.dose) return i.dose;
    if (i.label) return i.label;
    return (i.raw ? '~' : '') + qty(i.grams);
  }

  function shopText(list) {
    var t = '🛒 *LISTA DE COMPRAS SEMANAL* · ' + D.athlete.name + '\nSemana del ' + weekKey.split('-').reverse().join('/') + ' · ' + D.trainingDays + ' días ON + ' + (7 - D.trainingDays) + ' OFF\n';
    list.forEach(function (g) {
      t += '\n*' + g.cat.toUpperCase() + '*\n';
      g.items.forEach(function (i) { t += '▢ ' + i.name + ': *' + shopQty(i) + '*' + (i.note ? ' (' + i.note + ')' : i.hint ? ' (' + i.hint.replace('≈ ', '≈') + ')' : '') + '\n'; });
    });
    return t + '\n' + D.handle;
  }

  // ---------- Paneles (sheet inferior) ----------
  function open(bg, sh, h) { sh.innerHTML = '<div class="grab"></div>' + h; bg.className = 'sheet-bg open'; sh.className = 'sheet open'; }

  function renderPanel(bg, sh) {
    if (S.panel === 'install') {
      var steps = S.itab === 'ios'
        ? ['Abrí este link en <b>Safari</b> (en Chrome de iPhone no aparece la opción).', 'Tocá <b>Compartir</b> (cuadrado con flecha hacia arriba ⬆).', 'Deslizá y elegí <b>«Agregar a inicio»</b>.', 'Tocá <b>Agregar</b>: el ícono Nutrition queda en tu pantalla.']
        : ['Abrí este link en <b>Chrome</b>.', 'Tocá el menú <b>⋮</b> (arriba a la derecha).', 'Elegí <b>«Instalar app»</b> o «Agregar a la pantalla principal».', 'Confirmá <b>Instalar</b>: la app abre a pantalla completa y funciona sin señal.'];
      var h = D.markSm + '<div class="tag" style="margin-top:10px">[ INSTALAR APP · GUÍA PASO A PASO ]</div><h3>Llevá tu plan en el celular</h3>';
      h += '<div class="tabs"><button data-itab="ios" class="' + (S.itab === 'ios' ? 'on' : '') + '">IPHONE</button><button data-itab="android" class="' + (S.itab === 'android' ? 'on' : '') + '">ANDROID</button></div>';
      h += '<ol class="steps">' + steps.map(function (t, i) { return '<li><span class="n">' + (i + 1) + '</span><span>' + t + '</span></li>'; }).join('') + '</ol>';
      return open(bg, sh, h);
    }

  function labelCard(r) {
    var k = (r.servingG * S.portions) / 100;
    var row = function (l, v, u) { return '<div class="lt-row"><span>' + l + '</span><b>' + v + (u ? ' ' + u : '') + '</b></div>'; };
    var h = '<div class="scan"><div class="tag">[ TABLA NUTRICIONAL · ' + esc(r.brand || 'PRODUCTO') + ' ]</div><b class="scan-nm">' + esc(r.name) + '</b>';
    h += '<div class="lt"><div class="lt-hd"><span>Por porción (' + n0(r.servingG) + ' g)</span><span>Consumido</span></div>';
    [['Energía', 'kcal', 'kcal'], ['Proteínas', 'p', 'g'], ['Carbohidratos', 'c', 'g'], ['Grasas', 'f', 'g'], ['Sodio', 'sodium', 'mg']].forEach(function (q) {
      var per = r.per100[q[1]] * r.servingG / 100;
      h += '<div class="lt-row"><span>' + q[0] + '</span><i>' + (q[1] === 'sodium' ? n0(per) : n1(per)) + ' ' + q[2] + '</i><b>' + (q[1] === 'sodium' ? n0(r.per100[q[1]] * k) : n1(r.per100[q[1]] * k)) + ' ' + q[2] + '</b></div>';
    });
    h += '</div><label class="lbl">Porciones consumidas</label><div class="portions"><button data-portion="-0.5">−</button><b>' + n1(S.portions) + '</b><button data-portion="0.5">+</button><span>= ' + n0(r.servingG * S.portions) + ' g</span></div>';
    h += '<button class="add-meal" data-photo="add">[ + SUMAR A LA INGESTA SELECCIONADA ]</button></div>';
    return h;
  }

  function scanCard(r) {
    var color = r.score >= 70 ? '#38BDF8' : r.score >= 40 ? '#F97316' : '#EF4444';
    var h = '<div class="scan"><div class="row"><div style="min-width:0"><div class="tag">[ DESGLOSE DEL PLATO ]</div><b class="scan-nm">' + esc(r.dishName) + '</b></div>';
    h += '<div class="score" style="border-color:' + color + ';color:' + color + '"><b>' + r.score + '</b><span>SCORE TÁCTICO</span></div></div>';
    if (r.reason) h += '<p class="muted" style="font-size:12px;margin-top:4px">' + esc(r.reason) + '</p>';
    h += '<div class="scan-items">';
    r.items.forEach(function (i) {
      h += '<div class="scan-it"><span class="g">' + n0(i.grams) + ' g</span><span class="fd">' + esc(i.food) + '</span><span class="mc">P' + n0(i.p) + ' C' + n0(i.c) + ' G' + n0(i.f) + '</span></div>';
    });
    var t = r.items.reduce(function (a, i) { return { p: a.p + i.p, c: a.c + i.c, f: a.f + i.f, l: a.l + i.leucine }; }, { p: 0, c: 0, f: 0, l: 0 });

  function renderUnsafe() {

    }, { p: 0, c: 0, f: 0, k: 0 });
    var doneCount = list.filter(function (x) { return S.checks[x.m.id]; }).length;
    var complete = list.length > 0 && doneCount === list.length && tgt.kcal > 0 && Math.abs(eaten.k / tgt.kcal - 1) <= ADHERENCE_TOL;
    var h = '';

    // Fila 1 · HUD: logo + marca + fase + guía.
    h += '<header class="top">' + D.markSm + '<div class="tb"><div class="brand">COACH JP</div><div class="badge">[ BIOENERGETICS &amp; NUTRITION ]</div></div><div class="phase">' + esc(D.athlete.phase) + '</div><button class="guide-btn" data-panel="guide" aria-label="Guía">[ ? GUÍA ]</button></header>';

    h += '<div class="idrow"><div class="who"><b>' + esc(D.athlete.name) + '</b><span>' + esc(D.athlete.discipline) + '</span></div>';
    h += '<div class="datesel"><button data-day="-1" aria-label="Día anterior">◀</button><span class="dlab' + (S.date === today ? ' now' : '') + '">' + dateLabel(S.date) + '</span><button data-day="1" aria-label="Día siguiente">▶</button></div></div>';

    if (D.coachNote) {
      var head = D.coachNote.split(/[.!?](\s|$)/)[0];
      h += '<div class="directive' + (S.dirOpen ? ' open' : '') + '"><button data-dir="1"><span class="dh">🎯 <b>Directiva:</b> ' + esc(head.length > 64 ? head.slice(0, 62) + '…' : head) + '</span><span class="dv">[ ' + (S.dirOpen ? 'Ocultar' : 'Ver directiva') + ' ' + (S.dirOpen ? '▴' : '▾') + ' ]</span></button>' + (S.dirOpen ? '<p>' + esc(D.coachNote) + '</p>' : '') + '</div>';
    }

  // ---------- Utilidades ----------

  function mealLabel(id) {

  // ---------- Análisis de foto con IA en el dispositivo (Gemini, clave propia del atleta) ----------
  var GEMINI_CHAIN = ['gemini-3.5-flash-lite', 'gemini-3.5-flash'];
  var SCAN_TIMEOUT_MS = 12000;
  var SLOW_MSG = 'Conexión lenta. Reintentar o enviar foto al Coach por WhatsApp';

  function blobToB64(blob) {
    return new Promise(function (res, rej) {
      var r = new FileReader();
      r.onload = function () { res(String(r.result).split(',')[1]); };
      r.onerror = function () { rej(new Error('No se pudo leer la foto')); };
      r.readAsDataURL(blob);
    });
  }

  function callGemini(key, body, i) {
    var model = GEMINI_CHAIN[i];
    S.scanBusy = i === 0 ? (S.scanTab === 'label' ? 'LEYENDO TABLA NUTRICIONAL · ' : 'ANALIZANDO PLATO · ') + model : '[ ! ] CAMBIANDO A MODELO DE RESPALDO (' + model + ')...';
    renderSheet();
    var ctl = typeof AbortController === 'function' ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, SCAN_TIMEOUT_MS);
    return fetch('https://generativelanguage.googleapis.com/v1beta/models/' + model + ':generateContent?key=' + encodeURIComponent(key), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: ctl ? ctl.signal : undefined,
    }).then(function (res) {
      clearTimeout(timer);
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (res.ok) {
          var parts = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [];
          var text = parts.map(function (p) { return p.text || ''; }).join('');
          if (!text) throw new Error(model + ' no devolvió contenido');
          return text;
        }
        var msg = (data.error && data.error.message) || ('Gemini respondió ' + res.status);
        var retry = res.status === 503 || res.status === 429 || res.status === 404 || res.status >= 500 || /UNAVAILABLE|high demand|overloaded|RESOURCE_EXHAUSTED|quota|no longer available|not found/i.test(msg);
        if (retry && i + 1 < GEMINI_CHAIN.length) return callGemini(key, body, i + 1);
        if (res.status === 400 && /api key|API_KEY/i.test(msg)) msg = 'La API Key no es válida. Revisala en [ ⚙ CONFIGURAR API KEY GEMINI ].';
        throw new Error(msg);
      });
    }, function (err) {
      clearTimeout(timer);
      if (err && err.name === 'AbortError') { var e = new Error(SLOW_MSG); e.slow = true; throw e; }
      throw err;
    });
  }

  function num(v, fb) { var n = typeof v === 'number' ? v : parseFloat(v); return isFinite(n) ? n : fb; }

  function localScore(items) {
    var t = items.reduce(function (a, i) { return { p: a.p + i.p, c: a.c + i.c, f: a.f + i.f, l: a.l + i.leucine }; }, { p: 0, c: 0, f: 0, l: 0 });
    var kc = t.p * 4 + t.c * 4 + t.f * 9 || 1, ps = (t.p * 4) / kc, fs = (t.f * 9) / kc;
    var veg = items.some(function (i) { return /ensalada|verdura|vegetal|tomate|lechuga|brocoli|zanahoria|zapallo|fruta|manzana|banana/i.test(i.food); });
    var sc = Math.min(1, ps / 0.3) * 35 + Math.min(1, t.l / D.threshold) * 25 + (veg ? 20 : 0) + (fs <= 0.35 ? 20 : Math.max(0, 20 - (fs - 0.35) * 80));
    return Math.round(Math.max(0, Math.min(100, sc)));
  }

  function analyzePhoto() {
    var key = getKey();
    if (!key || !S.photo || S.scanBusy) return;
    S.scan = null; S.scanErr = null; S.scanErrKind = '';
    var asLabel = S.scanTab === 'label';
    blobToB64(S.photo.blob)
      .then(function (b64) {
        return callGemini(key, {
          contents: [{ role: 'user', parts: [{ text: asLabel ? D.labelPrompt : D.scanPrompt }, { inline_data: { mime_type: 'image/jpeg', data: b64 } }] }],
          generationConfig: { temperature: 0.2, responseMimeType: 'application/json' },
        }, 0);
      })
      .then(function (text) {
        var a = text.indexOf('{'), b = text.lastIndexOf('}');
        var json = JSON.parse(a >= 0 ? text.slice(a, b + 1) : text);
        if (asLabel) return readLabel(json);
        var items = (json.items || []).filter(function (i) { return i && i.food && num(i.grams, 0) > 0; }).map(function (i) {
          var p = Math.max(0, num(i.p, 0));
          return { food: String(i.food), grams: Math.round(num(i.grams, 0)), p: p, c: Math.max(0, num(i.c, 0)), f: Math.max(0, num(i.f, 0)), leucine: Math.max(0, num(i.leucine, p * 0.08)) };
        });
        if (!items.length) throw new Error('No se reconocieron alimentos en la foto. Probá con otra toma, más cerca y con buena luz.');
        var sc = num(json.score, NaN);
        S.scan = { dishName: String(json.dishName || 'Plato analizado'), items: items, score: isFinite(sc) ? Math.round(Math.max(0, Math.min(100, sc))) : localScore(items), reason: json.scoreReason || '', tips: (json.tips || []).slice(0, 3) };
      })
      .catch(function (err) { S.scanErr = (err && err.message) || String(err); S.scanErrKind = err && err.slow ? 'slow' : err && err.plate ? 'plate' : ''; })
      .then(function () { S.scanBusy = false; renderSheet(); });
  }

  // Tabla nutricional → valores por 100 g (de la columna por porción si es lo único legible).
  function readLabel(json) {
    if (json && (json.isLabel === false || json.looksLike === 'plate')) {
      var pe = new Error('Detectamos un plato preparado. Cambiá a la pestaña [ PLATO DE COMIDA ] para analizar sus porciones y macros');
      pe.plate = true;
      throw pe;
    }
    var serving = Math.max(1, num(json.servingG, 100));
    var per = json.per100 || {};
    var ps = json.perServing || {};
    var pick = function (k) { var v = num(per[k], NaN); return isFinite(v) ? v : num(ps[k], 0) * 100 / serving; };
    var p100 = { kcal: pick('kcal'), p: pick('p'), c: pick('c'), f: pick('f'), sodium: pick('sodiumMg') };
    if (!(p100.kcal > 0) && p100.p + p100.c + p100.f > 0) p100.kcal = p100.p * 4 + p100.c * 4 + p100.f * 9;
    if (!(p100.kcal > 0)) throw new Error('No se pudo leer la tabla. Encuadrá solo la tabla, de frente y con buena luz.');
    S.portions = 1;
    S.scan = { kind: 'label', name: String(json.productName || 'Producto'), brand: json.brand ? String(json.brand) : '', servingG: serving, per100: p100 };
  }

  function addScanToMeal() {
    if (!S.scan) return;

      if (!confirm('¿Reiniciar el checklist y la hidratación de este día?')) return;
      S.checks = {};
      S.free = {};
      store.set('checks:' + S.date, S.checks);
      store.set('free:' + S.date, S.free);
      setWater(0);
      toast('Checklist e hidratación del día reiniciados');
    }
  });

  document.addEventListener('input', function (e) {
    if (e.target.id === 'ph-note') S.phNote = e.target.value;
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'out-meal') S.outMeal = e.target.value;
    if (e.target.id === 'ph-meal') S.phMeal = e.target.value;
  });

  // ---------- Instalación PWA (prompt nativo o guía iOS / Android) ----------
  // Instalada (pantalla de inicio): el botón [ INSTALAR APP ] desaparece por completo.
  function syncInstall() {
    var btn = document.getElementById('install');
    var solo = isStandalone();
    document.body.classList.toggle('standalone', solo);
    if (btn) btn.hidden = solo;
  }
  try { window.matchMedia('(display-mode: standalone)').addEventListener('change', syncInstall); } catch (e) {}
  var deferred = null;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; });
  window.addEventListener('appinstalled', function () { deferred = null; syncInstall(); toast('App instalada · ya la tenés en tu inicio'); });
  function install() {
    if (isStandalone()) return toast('YA ESTÁ INSTALADA EN TU PANTALLA DE INICIO');
    if (deferred) {
      deferred.prompt();
      deferred.userChoice.then(function () { deferred = null; });
    } else {
      S.sheet = null;
      S.itab = isIOS() ? 'ios' : 'android';
      S.panel = 'install';
      renderSheet();
    }
  }

  if (!D.preview) {
    // Manifest en memoria con URLs absolutas (el data URI del <head> trae los iconos y es el respaldo).
    try {
      var here = location.href.split('#')[0].split('?')[0];
      var link = document.querySelector('link[rel="manifest"]');
      fetch(link.href)
        .then(function (r) { return r.json(); })
        .then(function (mf) {
          mf.start_url = here;
          mf.scope = here.replace(/[^/]*$/, '');
          mf.id = here;
          link.href = URL.createObjectURL(new Blob([JSON.stringify(mf)], { type: 'application/manifest+json' }));
        })
        .catch(function () {});
    } catch (e) {}
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
    // Ciclo diario: al abrir en una fecha nueva se archiva la última jornada usada.
    var last = store.get('lastOpen', null);
    if (last && last < today) { var keep = S.date; S.date = last; S.checks = store.get('checks:' + last, {}); S.extras = store.get('extras:' + last, {}); S.mode = modeFor(last); archive(last); loadDay(keep); }
    store.set('lastOpen', today);
    // A las 00:00 se archiva el día, se arranca la jornada en cero (checks y vasos) y se aplica el ON / OFF del cronograma.
    setInterval(function () {
      now = new Date();
      var t = isoDay(now);
      if (t !== today) {
        var wasToday = S.date === today;
        archive(today);
        today = t;
        weekKey = weekOf(now);
        S.shop = store.get('shop:' + weekKey, {});
        store.set('lastOpen', today);
        if (wasToday) { loadDay(today); toast('NUEVA JORNADA · checklist e hidratación en cero'); }
      }
      if (!S.sheet && !S.panel) render();
    }, 30000);
  } else {
    window.addEventListener('message', function (e) {
      var msg = e.data || {};
      if (msg.type === 'coachjp:payload') {
        D = msg.payload;
        S.mode = D.initialMode;
        render();
      } else if (msg.type === 'coachjp:mode') {
        S.mode = msg.mode;
        render();
      }
    });
  }

  render();
})();
</script>
</body>
